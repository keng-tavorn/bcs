# CI (spec §4.12, §15.5, FR-PLT-006): every pull request runs `pnpm verify --strict --e2e` against the same local
# services as a developer machine (docker-compose.yml), and a merge into main deploys staging (Vercel sin1, ADR-032)
# and checks /api/health. Branch protection must require the "verify" job (docs/runbooks/github-setup.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gh run list: the last commit of main whose run went green (the "Documents only?" step)
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # One run at a time per ref (P1-03): GitHub Free has 2,000 minutes a month and one full run takes 75 to 100 of
    # them. On main the run under way always finishes, and of the pushes made meanwhile only the newest waits (GitHub
    # drops the older waiting run); cancelling the run under way too meant that, with several chats pushing, no full run
    # ever finished (run 38257852567 cut at 41 minutes). A pull request's newer commit replaces its run under way.
    concurrency:
      group: ci-verify-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # The full e2e suite takes some 50 minutes on a 2-core runner
    timeout-minutes: 120
    env:
      # The checks run like a developer machine: local services only, never a shared database (§4.12)
      APP_ENV: local
      CI: "true"
      # tsc and next build of this codebase need more than Node's default heap on the runner (exit 134 otherwise)
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # verify compares migrations and ticks with git history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # scripts/validate_inputs.py (pnpm inputs:check, spec_check) reads the input workbook with openpyxl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install openpyxl pyyaml

      - name: Local services (Postgres, S3 storage, Mailpit, Inngest dev)
        run: docker compose up -d --wait

      - name: .env for this run (example values with fresh random secrets; nothing is stored)
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=base64:$(openssl rand -base64 32)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^SEED_DEV_PASSWORD=.*|SEED_DEV_PASSWORD=ci-$(openssl rand -hex 12)|" .env
          sed -i "s|^SEED_TOTP_KEY=.*|SEED_TOTP_KEY=$(openssl rand -hex 32)|" .env

      - run: pnpm install --frozen-lockfile

      # A change of documents only leaves out the e2e gate (scripts/lib/ci-changes.ts): a pull request compared with its
      # base, a push to main with the last commit of main whose run went green, not the push before it, whose run a newer
      # push may have cancelled. No green run yet, or any other file changed since: the full run. pnpm verify
      # --docs-only checks the same files again, and runs e2e after all if anything else changed.
      - name: Documents only?
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          pnpm exec tsx scripts/ci-changes.ts "$base" | tee -a "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Storage bucket and database
        run: |
          pnpm exec tsx --env-file=.env scripts/storage-init.ts
          pnpm db:migrate

      - name: pnpm verify --strict --e2e
        env:
          BASE: ${{ steps.changes.outputs.base }}
        run: |
          if [ "${{ steps.changes.outputs.docs_only }}" = "true" ]; then
            pnpm verify --strict --e2e --docs-only="$BASE"
          else
            pnpm verify --strict --e2e
          fi

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            .vitest/
          retention-days: 14

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # Never cut short: Vercel's build migrates staging and goes on server-side whatever happens to this job. A newer
    # commit's deploy waits for it (one waiting deploy at most, the newest)
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    timeout-minutes: 30
    environment: staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Vercel's build (vercel.json buildCommand) applies pending migrations with DIRECT_URL, the migrator role, before
      # building; the running app uses DATABASE_URL, the app role (FR-PLT-006 AC3)
      - name: Deploy the staging project (APP_ENV=staging; --prod is the staging project's main URL, ADR-032)
        id: deploy
        run: |
          url=$(pnpm dlx vercel@62.2.0 deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env APP_COMMIT_SHA=${{ github.sha }} --env APP_COMMIT_SHA=${{ github.sha }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: /api/health answers 200 with this commit (FR-PLT-006 AC2)
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        # The staging domain moves to the new deployment a little after vercel deploy returns (run 38269418092 read the
        # previous commit once and failed): ask again until it answers ok with this commit, for at most 5 minutes
        run: |
          base="${STAGING_URL:-${{ steps.deploy.outputs.url }}}"
          for attempt in $(seq 1 30); do
            body=$(curl -fsS "$base/api/health" || true)
            if echo "$body" | grep -q '"status":"ok"' && echo "$body" | grep -q '"commit":"${{ github.sha }}"'; then
              echo "$body"
              exit 0
            fi
            echo "attempt $attempt: $body"
            sleep 10
          done
          echo "/api/health did not answer ok with ${{ github.sha }} within 5 minutes"
          exit 1
