# Local stand-ins for external services (spec §5.3, ADR-025). Ports: 5432 Postgres · 9000/9001 S3 storage
# (RustFS, replaces MinIO whose official images were removed — ADR-036) · 1025/8025 Mailpit · 8288 Inngest dev.
name: bcs
services:
  postgres:
    image: postgres:17.11
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bcs
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bcs"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # same credentials as S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in .env.example (spec Appendix B)
      RUSTFS_ACCESS_KEY: minio
      RUSTFS_SECRET_KEY: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["1025:1025", "8025:8025"]

  inngest:
    image: inngest/inngest:v1.45.1
    command: "inngest dev -u http://host.docker.internal:3000/api/inngest"
    ports: ["8288:8288", "8289:8289"]
    extra_hosts: ["host.docker.internal:host-gateway"]

volumes:
  pg-data: {}
  storage-data: {}
