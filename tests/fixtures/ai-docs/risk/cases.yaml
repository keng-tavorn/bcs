# The evaluation set of the Risk Agent, demo tier (S11-14 · FR-AI-306 AC5 · BR-AI-34 · ADR-146): 10 synthetic documents a
# supplier sends with its risk questionnaire — 3 privacy (PDPA) papers, 3 information-security papers, 2 site-safety
# papers and 2 company certificates — drawn by scripts/ai-docs-risk.ts as the file the AI reads, with the answers a person
# checked. Every company, person, address and figure is invented; each page says it is synthetic.
#
# Each document is one call of RISK_ANSWER_DRAFT that asks all 12 questions of SIMEC's draft set (OQ-221 · ai-eval-risk.ts),
# as for a supplier that handles personal data, enters systems and sites, and is HIGH at the start, with nothing answered.
#   file      EVIDENCE <question> (a RISK_EVIDENCE file of an answer, sent as "evidence for <question>") · DOCUMENT
#             COMPANY_CERT (a verified supplier document, sent by its type). The site-safety papers are evidence of
#             RQ-PRM-01 as if the organization opened that question to the AI (aiReadable): the draft set keeps it closed.
#   expect    the questions the document answers, with the option a person reads in it (scored: optionCode ≥ 90 %)
#   mayAnswer a question the document touches but does not settle: leaving it out or giving this option are both right
#             (a certificate still being worked towards); any other option counts as a false positive
#   every other question asked has no support in the document: proposing any answer to it is a false positive (≤ 5 %)
#   review    RISK_FILE_SUMMARY for the reviewer of the document's domain: what the supplier answered (GENERAL and the
#             domain) and the questions whose answer this document contradicts (none for a certificate: the summary
#             sends a certificate only when an answer rests on it, and no answer rests on a company certificate)
#   layout    A4_TYPED (PDF) · A4_SCANNED (JPEG, grey and soft) · PHOTO (JPEG, tilted on a desk)
#   quality   CLEAN · SKEWED · BLURRY · STAMPED (a stamp "สำเนาถูกต้อง" and a signature across the text)
#   digits    ARABIC · THAI (๐–๙ in numbers and dates) · dates are Gregorian here, the documents print the Buddhist era
