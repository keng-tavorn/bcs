    title: นโยบายคุ้มครองข้อมูลส่วนบุคคล
    issuedOn: '2026-06-01'
    sections:
      - heading: วัตถุประสงค์และขอบเขต
        body: บริษัทให้บริการประมวลผลเงินเดือนแทนลูกค้าองค์กร นโยบายนี้ใช้กับข้อมูลส่วนบุคคลทุกประเภทที่บริษัทประมวลผลในฐานะผู้ประมวลผลข้อมูลส่วนบุคคลตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล พ.ศ. 2562
      - heading: เจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล
        body: บริษัทแต่งตั้งเจ้าหน้าที่คุ้มครองข้อมูลส่วนบุคคล (DPO) ติดต่อได้ที่ dpo@nonthaburi-data.example
      - heading: ข้อตกลงกับลูกค้า
        body: บริษัทยินดีลงนามข้อตกลงการประมวลผลข้อมูลส่วนบุคคล (DPA) กับลูกค้าทุกรายก่อนเริ่มงาน และประมวลผลข้อมูลตามคำสั่งของผู้ควบคุมข้อมูลเท่านั้น
      - heading: สถานที่จัดเก็บข้อมูล
        body: ข้อมูลทั้งหมดจัดเก็บในศูนย์ข้อมูลของบริษัทที่จังหวัดนนทบุรี และสำรองที่ศูนย์ข้อมูลสำรองในกรุงเทพมหานคร บริษัทไม่โอนหรือส่งข้อมูลส่วนบุคคลไปยังต่างประเทศ
      - heading: ระยะเวลาเก็บรักษา
        body: บริษัทเก็บข้อมูลไม่เกินระยะเวลาที่สัญญาและกฎหมายกำหนด แล้วทำลายด้วยวิธีที่กู้คืนไม่ได้ภายใน 30 วัน
      - heading: การทบทวนนโยบาย
        body: คณะกรรมการบริษัททบทวนนโยบายนี้อย่างน้อยปีละ 1 ครั้ง
