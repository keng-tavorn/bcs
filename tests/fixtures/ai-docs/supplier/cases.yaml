# The evaluation set of the Supplier Onboarding Agent, demo tier (S7-15 · FR-AI-304 AC5 · ADR-146 · OQ-186): 12 synthetic
# documents of juristic suppliers — 7 company certificates (หนังสือรับรองบริษัท) and 5 VAT registrations (ภ.พ.20) — drawn
# by scripts/ai-docs-supplier.ts as the file the AI reads, with the answer a person checked. No bank book: the AI does
# not read one by default (OQ-186). Every company, person and address is invented; tax ids carry the synthetic prefix
# 0999998 with a valid check digit (BR-TAXID-01). Dates are Gregorian here; the documents print them in the Buddhist era.
#   layout   A4_TYPED (PDF) · A4_SCANNED (JPEG, grey and soft) · PHOTO (JPEG, tilted on a desk)
#   quality  CLEAN · SKEWED · BLURRY · STAMPED (a stamp "สำเนาถูกต้อง" and a signature across the text)
#   digits   ARABIC · THAI (๐–๙ in numbers and dates)
#   dates    BE_LONG (20 ตุลาคม 2569) · BE_SHORT (20 ต.ค. 69)
#   name     FULL (บริษัท … จำกัด) · ABBREVIATED (บจก. … as the header prints it · the truth is the full legal name)
