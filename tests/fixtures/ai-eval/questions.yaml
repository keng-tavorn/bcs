# Insight questions of the AI evaluation set, demo tier (S13-05, docs/sub-specs/S13.md "ชุดประเมิน" and "เครื่องมือของ
# Insight"): 30 questions in Thai with the tools that answer them, and 12 questions on access that every seeded role
# asks (tests/integration of S13-10 checks every ref of the answers against the asker's access). `tools` lists the
# read-only tools a right answer uses; the order does not count.
