      - { lineNo: 2, description: "ทรายหยาบ", uom: ลบ.ม., quantity: "60", isService: false, refUnitPrice: "450.00", reference: { source: HISTORY, unitPrice: "450.00" }, en: [[sand]], uomEn: [m3, "m³", cum, cubic meter, cubic metre, cbm, cu m] }
      - { lineNo: 3, description: "หินเบอร์ 2", uom: ลบ.ม., quantity: "60", isService: false, refUnitPrice: "520.00", reference: { source: HISTORY, unitPrice: "520.00" }, en: [[stone, gravel, aggregate, rock]], uomEn: [m3, "m³", cum, cubic meter, cubic metre, cbm, cu m] }
