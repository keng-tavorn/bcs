      # line 2: (300 − 450) ÷ 450 = −33.3 % → LOW · line 1 +11.1 % no flag
      - { supplierCode: SP0202, supplier: "บริษัท ศรีราชาคอนกรีต จำกัด", prices: { 1: "150.00", 2: "300.00", 3: "530.00" } }
