      - { supplierCode: SP0301, supplier: "บริษัท เซฟตี้เฟิร์สซัพพลาย จำกัด", prices: { 1: "118.00", 2: "445.00", 3: "175.00", 4: "90.00" } }
      # an individual: named by code only (BR-AI-32) · line 4: (60 − 95) ÷ 95 = −36.8 % → LOW · line 2 against SP0301's 430.00 (AGREEMENT_OTHER) −2.3 %
      - { supplierCode: SP0302, supplier: "นายสมชาย ใจกล้า", individual: true, vatRegistered: false, prices: { 1: "110.00", 2: "420.00", 3: "170.00", 4: "60.00" } }
      - { supplierCode: SP0303, supplier: "บริษัท ไทยพีพีอีเทรดดิ้ง จำกัด", incumbent: true, prices: { 1: "125.00", 2: "440.00", 3: "185.00", 4: "98.00" } }
    expectFlags:
      - { supplierCode: SP0301, lineNo: 2, flag: ABOVE_AGREEMENT }
      - { supplierCode: SP0302, lineNo: 4, flag: LOW }

