# The evaluation set of the Sourcing Agent, demo tier (S10-19 · FR-AI-305 AC5 · OQ-209): 10 synthetic RFx of the
# phase-1 company (a contractor), 6 RFQ and 4 RFP, each with the lines a requester wrote and the bids after the close.
# scripts/ai-eval-sourcing.ts turns each case into what the agent sends Claude (rfxDraftInputText for RFX_DRAFT,
# sourcingFacts for BID_SUMMARY and NEGOTIATION_POINTS) through the code the app uses (compareBids, priceAnomaly,
# bidSpread), so the measure is of the call the app makes.
#
# The answers a person checked (expect · expectFlags · en · uomEn):
#   expect.kind     the kind of RFx a buyer would send: RFQ when every line is goods with a reference price, else RFP
#   expectFlags     every price flag of BR-RFX-11 (the threshold 20 % · OQ-208), worked by hand below each case; the
#                   loader stops when code's flags differ, so the summary is scored against flags that are right
#   en              per line, groups of words the English description must hold (any word of each group)
#   uomEn           per line, the English units a buyer accepts
# A line's reference: its own agreed price when the bidder has one (AGREEMENT), else the lowest agreed price of another
# supplier (AGREEMENT_OTHER), else `reference` (CATALOG, HISTORY or MANUAL), as comparison.ts picks it.
# A bid's VAT rate: 7 % when registered and not abroad, else 0. Prices are before VAT unless priceIncludesVat.

cases:
  # 6 RFQ ------------------------------------------------------------------------------------------------------------
  - id: RFX-01
    number: RFX-2569-00101
    createdAs: RFQ
    category: STEEL
    expect: { kind: RFQ }
    lines:
      - { lineNo: 1, description: "เหล็กข้ออ้อย DB16 SD40 ยาว 10 ม.", uom: เส้น, quantity: "400", isService: false, refUnitPrice: "185.00", reference: { source: CATALOG, unitPrice: "185.00" }, en: [[db16, db 16], [sd40, sd 40], [deformed, rebar, reinforc]], uomEn: [bar, piece, pc, length, rod, each, ea, stick] }
      - { lineNo: 2, description: "เหล็กข้ออ้อย DB12 SD40 ยาว 10 ม.", uom: เส้น, quantity: "300", isService: false, refUnitPrice: "105.00", reference: { source: CATALOG, unitPrice: "105.00" }, en: [[db12, db 12], [sd40, sd 40], [deformed, rebar, reinforc]], uomEn: [bar, piece, pc, length, rod, each, ea, stick] }
      - { lineNo: 3, description: "ลวดผูกเหล็ก เบอร์ 18", uom: กก., quantity: "50", isService: false, refUnitPrice: "45.00", reference: { source: CATALOG, unitPrice: "45.00" }, en: [[wire], [tie, tying, binding]], uomEn: [kg, kilogram] }
    bids:
      - { supplierCode: SP0101, supplier: "บริษัท เหล็กทวีกิจ จำกัด", prices: { 1: "182.00", 2: "104.00", 3: "46.00" } }
      # 186.00 105.00 46.00 before VAT
      - { supplierCode: SP0102, supplier: "บริษัท สหเหล็กก่อสร้าง จำกัด", priceIncludesVat: true, prices: { 1: "199.02", 2: "112.35", 3: "49.22" } }
      # line 3: (60 − 45) ÷ 45 = +33.3 % > 20 % → HIGH
      - { supplierCode: SP0103, supplier: "ห้างหุ้นส่วนจำกัด รุ่งเจริญค้าเหล็ก", incumbent: true, prices: { 1: "190.00", 2: "108.00", 3: "60.00" } }
    expectFlags:
      - { supplierCode: SP0103, lineNo: 3, flag: HIGH }

