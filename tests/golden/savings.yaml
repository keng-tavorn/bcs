# tests/golden/savings.yaml
suite: savings
settings: { windowDays: 365, minSamples: 3, alertBp: 1000, agreementDays: 30 }
defaults: { at: "2026-10-06T03:00:00Z", today: "2026-10-06", approvedAt: "2026-09-01T03:00:00Z", stage: POOL, dept: CON, site: HQ, kind: GOODS, supplier: null, qty: "1", includesVat: false }
# lines: บรรทัดที่ยังสั่งได้ { ref, item (สินค้าในแคตตาล็อก กุญแจ item:<item>) หรือ d (กุญแจ = d), stage (PENDING_APPROVAL · POOL), dept, site, kind, supplier, qty, unitPrice, includesVat }
# purchases: บรรทัด PO ที่อนุมัติแล้ว { ref, item หรือ d, unitPrice, qty, approvedAt, includesVat, agreement } · ยอด = lineNet(qty, unitPrice)
# agreements: { id, item, supplier, unitPrice, validFrom, validTo, ended }
# expect: total และ opportunities ตามลำดับ BR-SAV-05 · PRICE_ABOVE_HISTORY { line, saving, reference, count, purchases } · OFF_AGREEMENT { line, saving, agreement, agreed } · SAME_ITEM_DEPARTMENTS { lines, saving, lowest } · AGREEMENT_EXPIRING { agreement, daysLeft, spent, purchases }
cases:
  - { id: GC-SAV-01, title: ราคาสูงกว่าค่ากลางของ PO ที่เคยซื้อ, input: { purchases: [{ ref: P1, d: drill, unitPrice: "2400.00", approvedAt: "2026-09-01T03:00:00Z" }, { ref: P2, d: drill, unitPrice: "2380.00", approvedAt: "2026-08-01T03:00:00Z" }, { ref: P3, d: drill, unitPrice: "2450.00", approvedAt: "2026-07-01T03:00:00Z" }], lines: [{ ref: L1, d: drill, stage: PENDING_APPROVAL, qty: "2", unitPrice: "2700.00" }] }, expect: { total: "600.00", opportunities: [{ kind: PRICE_ABOVE_HISTORY, line: L1, saving: "600.00", reference: "2400.00", count: 3, purchases: [P1, P2, P3] }] } }
  - { id: GC-SAV-02, title: สูงกว่าเท่าเกณฑ์พอดีไม่นับ, input: { purchases: [{ ref: P1, d: drill, unitPrice: "2400.00" }, { ref: P2, d: drill, unitPrice: "2380.00" }, { ref: P3, d: drill, unitPrice: "2450.00" }], lines: [{ ref: L1, d: drill, qty: "2", unitPrice: "2640.00" }] }, expect: { total: "0.00", opportunities: [] } }
  - { id: GC-SAV-03, title: ตัวอย่างไม่ครบเกณฑ์ไม่นับ, input: { purchases: [{ ref: P1, d: drill, unitPrice: "2400.00" }, { ref: P2, d: drill, unitPrice: "2380.00" }], lines: [{ ref: L1, d: drill, qty: "2", unitPrice: "2700.00" }] }, expect: { total: "0.00", opportunities: [] } }
  - { id: GC-SAV-04, title: จำนวนทศนิยมปัดที่ยอดบรรทัดเท่านั้น, input: { purchases: [{ ref: P1, d: wire, unitPrice: "9.00", approvedAt: "2026-09-03T03:00:00Z" }, { ref: P2, d: wire, unitPrice: "9.00", approvedAt: "2026-09-02T03:00:00Z" }, { ref: P3, d: wire, unitPrice: "9.00" }], lines: [{ ref: L1, d: wire, qty: "2.5", unitPrice: "10.01" }] }, expect: { total: "2.53", opportunities: [{ kind: PRICE_ABOVE_HISTORY, line: L1, saving: "2.53", reference: "9.00", count: 3, purchases: [P1, P2, P3] }] } }
  - { id: GC-SAV-05, title: คำขอราคารวม VAT ไม่นับ, input: { purchases: [{ ref: P1, d: drill, unitPrice: "100.00" }, { ref: P2, d: drill, unitPrice: "100.00" }, { ref: P3, d: drill, unitPrice: "100.00" }], lines: [{ ref: L1, d: drill, unitPrice: "150.00", includesVat: true }, { ref: L2, d: drill, dept: ENG, unitPrice: "100.00" }] }, expect: { total: "0.00", opportunities: [] } }
  - { id: GC-SAV-06, title: ซื้อนอกราคาตกลงเทียบราคาตกลงต่ำสุด, input: { agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "177.00", validFrom: "2026-01-01", validTo: "2027-01-01" }, { id: A2, item: MAT-004, supplier: S3, unitPrice: "175.00", validFrom: "2026-06-01", validTo: "2027-06-01" }], lines: [{ ref: L1, item: MAT-004, supplier: S2, qty: "100", unitPrice: "185.00" }] }, expect: { total: "1000.00", opportunities: [{ kind: OFF_AGREEMENT, line: L1, saving: "1000.00", agreement: A2, agreed: "175.00" }] } }
  - { id: GC-SAV-07, title: ผู้ขายที่มีราคาตกลงไม่นับ ยังไม่มีผู้ขายนับ, input: { agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "177.00", validFrom: "2026-01-01", validTo: "2027-01-01" }, { id: A2, item: MAT-004, supplier: S3, unitPrice: "175.00", validFrom: "2026-06-01", validTo: "2027-06-01" }], lines: [{ ref: L1, item: MAT-004, supplier: S1, qty: "10", unitPrice: "177.00" }, { ref: L2, item: MAT-004, qty: "10", unitPrice: "180.00" }] }, expect: { total: "50.00", opportunities: [{ kind: OFF_AGREEMENT, line: L2, saving: "50.00", agreement: A2, agreed: "175.00" }] } }
  - { id: GC-SAV-08, title: ราคาตกลงที่ยังไม่เริ่มไม่นับ ที่หมดวันนี้ยังนับ, input: { agreements: [{ id: A3, item: MAT-004, supplier: S1, unitPrice: "170.00", validFrom: "2026-10-07", validTo: "2027-10-07" }, { id: A4, item: MAT-005, supplier: S1, unitPrice: "50.00", validFrom: "2026-01-01", validTo: "2026-10-07" }], lines: [{ ref: L1, item: MAT-004, supplier: S2, qty: "10", unitPrice: "185.00" }, { ref: L2, item: MAT-005, supplier: S2, qty: "3", unitPrice: "60.00" }] }, expect: { total: "30.00", opportunities: [{ kind: OFF_AGREEMENT, line: L2, saving: "30.00", agreement: A4, agreed: "50.00" }, { kind: AGREEMENT_EXPIRING, agreement: A4, daysLeft: 1, spent: "0.00", purchases: [] }] } }
  - { id: GC-SAV-09, title: ของเดียวกันสองแผนกในกองคำขอที่ราคาต่ำสุด, input: { lines: [{ ref: L1, d: cement, qty: "10", unitPrice: "120.00" }, { ref: L2, d: cement, dept: ENG, qty: "5", unitPrice: "100.00" }, { ref: L3, d: cement, qty: "2", unitPrice: "110.00" }] }, expect: { total: "220.00", opportunities: [{ kind: SAME_ITEM_DEPARTMENTS, lines: [L1, L2, L3], saving: "220.00", lowest: "100.00" }] } }
  - { id: GC-SAV-10, title: แผนกเดียว คนละสถานที่ส่ง หรือรออนุมัติ ไม่รวม, input: { lines: [{ ref: L1, d: cement, qty: "10", unitPrice: "120.00" }, { ref: L2, d: cement, dept: ENG, site: SITE-B, qty: "5", unitPrice: "100.00" }, { ref: L3, d: cement, dept: ENG, stage: PENDING_APPROVAL, qty: "5", unitPrice: "100.00" }, { ref: L4, d: cement, unitPrice: "110.00" }] }, expect: { total: "0.00", opportunities: [] } }
  - { id: GC-SAV-11, title: บรรทัดที่แพงกว่าประวัติและนอกราคาตกลงนับยอดที่มากกว่าครั้งเดียว, input: { purchases: [{ ref: P1, item: MAT-004, unitPrice: "170.00", approvedAt: "2026-09-01T03:00:00Z" }, { ref: P2, item: MAT-004, unitPrice: "172.00", approvedAt: "2026-08-01T03:00:00Z" }, { ref: P3, item: MAT-004, unitPrice: "171.00", approvedAt: "2026-07-01T03:00:00Z" }], agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "175.00", validFrom: "2026-01-01", validTo: "2027-01-01" }], lines: [{ ref: L1, item: MAT-004, stage: PENDING_APPROVAL, supplier: S2, qty: "10", unitPrice: "200.00" }] }, expect: { total: "290.00", opportunities: [{ kind: PRICE_ABOVE_HISTORY, line: L1, saving: "290.00", reference: "171.00", count: 3, purchases: [P1, P2, P3] }, { kind: OFF_AGREEMENT, line: L1, saving: "250.00", agreement: A1, agreed: "175.00" }] } }
  - { id: GC-SAV-12, title: ราคาตกลงหมดภายใน 30 วันพร้อมยอดที่ซื้อในช่วง, input: { agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "177.00", validFrom: "2026-01-01", validTo: "2026-10-20" }], purchases: [{ ref: P1, item: MAT-004, unitPrice: "177.00", qty: "10", approvedAt: "2026-09-01T03:00:00Z", agreement: A1 }, { ref: P2, item: MAT-004, unitPrice: "177.00", qty: "5", approvedAt: "2026-09-15T03:00:00Z", agreement: A1 }, { ref: P3, item: MAT-004, unitPrice: "177.00", qty: "4", approvedAt: "2025-10-01T03:00:00Z", agreement: A1 }] }, expect: { total: "0.00", opportunities: [{ kind: AGREEMENT_EXPIRING, agreement: A1, daysLeft: 14, spent: "2655.00", purchases: [P2, P1] }] } }
  - { id: GC-SAV-13, title: ขอบ 30 วัน, input: { agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "177.00", validFrom: "2026-01-01", validTo: "2026-11-05" }, { id: A2, item: MAT-005, supplier: S1, unitPrice: "50.00", validFrom: "2026-01-01", validTo: "2026-11-06" }] }, expect: { total: "0.00", opportunities: [{ kind: AGREEMENT_EXPIRING, agreement: A1, daysLeft: 30, spent: "0.00", purchases: [] }] } }
  - { id: GC-SAV-14, title: ต่ออายุต่อเนื่องหรือสิ้นสุดแล้วไม่นับ เว้นวันยังนับ, input: { agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "177.00", validFrom: "2026-01-01", validTo: "2026-10-20" }, { id: A2, item: MAT-004, supplier: S1, unitPrice: "180.00", validFrom: "2026-10-20", validTo: "2027-10-20" }, { id: A3, item: MAT-005, supplier: S1, unitPrice: "50.00", validFrom: "2026-01-01", validTo: "2026-10-07", ended: true }, { id: A4, item: MAT-006, supplier: S2, unitPrice: "30.00", validFrom: "2026-01-01", validTo: "2026-10-15" }, { id: A5, item: MAT-006, supplier: S2, unitPrice: "31.00", validFrom: "2026-10-16", validTo: "2027-10-16" }] }, expect: { total: "0.00", opportunities: [{ kind: AGREEMENT_EXPIRING, agreement: A4, daysLeft: 9, spent: "0.00", purchases: [] }] } }
  - { id: GC-SAV-15, title: เรียงยอดมากก่อนและรวมยอด, input: { agreements: [{ id: A1, item: MAT-004, supplier: S1, unitPrice: "177.00", validFrom: "2026-01-01", validTo: "2027-01-01" }, { id: A2, item: MAT-004, supplier: S3, unitPrice: "175.00", validFrom: "2026-06-01", validTo: "2027-06-01" }], lines: [{ ref: L1, item: MAT-004, supplier: S2, qty: "100", unitPrice: "185.00" }, { ref: L2, d: cement, qty: "10", unitPrice: "120.00" }, { ref: L3, d: cement, dept: ENG, qty: "5", unitPrice: "100.00" }, { ref: L4, d: cement, qty: "2", unitPrice: "110.00" }] }, expect: { total: "1220.00", opportunities: [{ kind: OFF_AGREEMENT, line: L1, saving: "1000.00", agreement: A2, agreed: "175.00" }, { kind: SAME_ITEM_DEPARTMENTS, lines: [L2, L3, L4], saving: "220.00", lowest: "100.00" }] } }
  - { id: GC-SAV-16, title: บริการไม่นับทั้งแพงกว่าประวัติและหลายแผนก ราคาตกลงของบริการยังนับ, input: { purchases: [{ ref: P1, d: plumbing, unitPrice: "1516200.00" }, { ref: P2, d: plumbing, unitPrice: "313700.00" }, { ref: P3, d: plumbing, unitPrice: "1956300.00" }], agreements: [{ id: A1, item: SVC-01, supplier: S1, unitPrice: "450.00", validFrom: "2026-01-01", validTo: "2027-01-01" }], lines: [{ ref: L1, d: plumbing, kind: SERVICE, stage: PENDING_APPROVAL, unitPrice: "3746200.00" }, { ref: L2, d: guard, kind: SERVICE, qty: "10", unitPrice: "120.00" }, { ref: L3, d: guard, kind: SERVICE, dept: ENG, qty: "5", unitPrice: "100.00" }, { ref: L4, item: SVC-01, kind: SERVICE, supplier: S2, qty: "2", unitPrice: "500.00" }] }, expect: { total: "100.00", opportunities: [{ kind: OFF_AGREEMENT, line: L4, saving: "100.00", agreement: A1, agreed: "450.00" }] } }
